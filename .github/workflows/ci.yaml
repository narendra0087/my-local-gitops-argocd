name: Build and Deploy Automation Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'Dockerfile'

jobs:
  ci-cd-lifecycle:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build Container and Push to Registry
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/local-node-app:${{ github.sha }}
          ${{ secrets.DOCKERHUB_USERNAME }}/local-node-app:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Update Target Manifest Image Tag
      run: |
        sed -i "s|image: .*|image: ${{ secrets.DOCKERHUB_USERNAME }}/local-node-app:${{ github.sha }}|g" k8s/deployment.yaml

    - name: Commit and Push Updated Manifest Changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@://github.com"
        git add k8s/deployment.yaml
        git commit -m "automation: update container runtime image tag to match run ${{ github.sha }} [skip ci]"
        git push origin main
