apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fresh-gitops-pipeline
  namespace: argocd
spec:
  project: default

  source:
    repoURL: 'https://github.com/narendra0087/my-local-gitops-argocd.git'
    targetRevision: HEAD
    path: k8s

  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
