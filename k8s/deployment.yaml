apiVersion: apps/v1
kind: Deployment
metadata:
  name: local-node-app
  namespace: default
  labels:
    app: local-node-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: local-node-app
  template:
    metadata:
      labels:
        app: local-node-app
    spec:
      containers:
      - name: app-container
        image: narendra087/local-node-app:5ec0c2df9922c5a9f85667e02bbe379ce7390f64
        ports:
        - containerPort: 8080
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
